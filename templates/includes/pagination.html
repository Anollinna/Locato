<div class="d-flex justify-content-center mt-4">
  <nav aria-label="Page navigation">
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?page=1{% for city in selected_cities %}&city={{ city }}{% endfor %}">&laquo; First</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.previous_page_number }}{% for city in selected_cities %}&city={{ city }}{% endfor %}">Previous</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">First</span></li>
        <li class="page-item disabled"><span class="page-link">Previous</span></li>
      {% endif %}

      <li class="page-item disabled">
        <span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
      </li>

      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.next_page_number }}{% for city in selected_cities %}&city={{ city }}{% endfor %}">Next</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.paginator.num_pages }}{% for city in selected_cities %}&city={{ city }}{% endfor %}">Last &raquo;</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">Next</span></li>
        <li class="page-item disabled"><span class="page-link">Last</span></li>
      {% endif %}
    </ul>
  </nav>
</div>
