{% extends "base.html" %}

{% block content %}
  <div class="container mt-4">
    <h2>Countries</h2>
    <ul class="list-group">
      {% for country in country_list %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          {{ country.name.name }}
          <span class="badge bg-primary rounded-pill">{{ country.get_continent_display }}</span>
        </li>
      {% empty %}
        <li class="list-group-item">No countries available.</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
